name: Generate episode and optional private upload
on:
  workflow_dispatch:
    inputs:
      topic:
        description: Episode topic (must match reviewed research)
        type: string
      period:
        description: Historical period (must match dossier)
        type: string
      dossier:
        description: auto, reviewed dossier path, or verified:RUN_NUMBER from full verification
        type: string
        default: auto
      mode:
        type: choice
        options: [mock, production]
        default: production
      target:
        description: Target narration seconds (600–900)
        type: number
        default: 720
      workers:
        description: Independent image jobs (1–20)
        type: number
        default: 20
      visibility:
        type: choice
        options: [private, unlisted, public]
        default: private
      captions:
        type: boolean
        default: true
      music:
        type: boolean
        default: true
      preview_only:
        description: Skip YouTube upload
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: somoy-jatri-production
  cancel-in-progress: false
env:
  RUN: episode-${{ github.run_id }}
  PREPARATION_PROCESS: after-dark
  STORY_MODEL: Qwen/Qwen3-4B-Instruct-2507
  ALIGNMENT_MODEL: base
  OMP_NUM_THREADS: '4'
  ALIGNMENT_BACKEND: local
  CPU_THREADS: '4'
  HF_HUB_DISABLE_XET: '1'
  RUN_SCOPED_CLEANUP: 'true'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference local Qwen CPU runtime
        if: inputs.mode == 'production' && !startsWith(inputs.dossier, 'verified:')
        run: pip install -e . -r requirements-story.txt
      - name: Verify Qwen Bengali generation before video setup
        if: inputs.mode == 'production' && !startsWith(inputs.dossier, 'verified:')
        run: python -u scripts/check_story_cpu.py
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig
      - run: pip install -e '.[google]'
      - name: Verify private upload readiness before generation
        if: inputs.mode == 'production' && !inputs.preview_only
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          EXPECTED_CHANNEL_ID: ${{ vars.EXPECTED_CHANNEL_ID }}
          EXPECTED_DRIVE_EMAIL: ${{ vars.EXPECTED_DRIVE_EMAIL }}
        run: python -u scripts/check_connections.py
      - if: inputs.mode == 'production'
        run: |
          pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-tts.txt
      - name: Verify Bengali narration before writing a full story
        if: inputs.mode == 'production' && !startsWith(inputs.dossier, 'verified:')
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u scripts/check_bangla_voice.py
      - id: matrix
        env:
          WORKERS: ${{ inputs.workers }}
        run: |
          python - <<'PYCODE'
          import os,json
          n=int(os.environ['WORKERS'])
          if not 1<=n<=20: raise ValueError('Use 1–20 workers')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps({'shard':list(range(n))})+'\n')
          PYCODE
      - name: Require successful verification before using a tested storyboard
        if: startsWith(inputs.dossier, 'verified:')
        id: verified
        env:
          RESEARCH_DOSSIER: ${{ inputs.dossier }}
          GH_TOKEN: ${{ github.token }}
          VERIFIED_OPERATION: check
        run: python scripts/stage_verified_story.py
      - uses: actions/download-artifact@v4
        if: startsWith(inputs.dossier, 'verified:')
        with:
          name: storyboard-replay
          run-id: ${{ steps.verified.outputs.source_run }}
          github-token: ${{ github.token }}
          path: output/verified-input
      - name: Stage only the tested script and matching research receipt
        if: startsWith(inputs.dossier, 'verified:')
        env:
          RESEARCH_DOSSIER: ${{ inputs.dossier }}
          GH_TOKEN: ${{ github.token }}
          VERIFIED_OPERATION: stage
        run: python scripts/stage_verified_story.py
      - name: Start legacy Qwen only for old verified artifacts
        if: inputs.mode == 'production' && startsWith(inputs.dossier, 'verified:')
        run: |
          pip install 'huggingface-hub>=0.34,<1'
          bash scripts/setup_qwen.sh
      - name: Stage fresh Bangla story — reference outline and four chapter batches
        if: inputs.mode == 'production' && !startsWith(inputs.dossier, 'verified:')
        env:
          RESEARCH_DOSSIER: ${{ inputs.dossier }}
          TOPIC: ${{ inputs.topic }}
          PERIOD: ${{ inputs.period }}
          TARGET: ${{ inputs.target }}
          WORKERS: ${{ inputs.workers }}
          CAPTIONS: ${{ inputs.captions }}
          MUSIC: ${{ inputs.music }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python - <<'PYCODE'
          import os
          from somoy_jatri.utils import save
          from somoy_jatri.storage.drive import Store
          if os.getenv('DRIVE_FOLDER_ID'):
              save('output/topic-history.json',Store().load('topic-history.json',[]))
          PYCODE
          extra=()
          if [ "$CAPTIONS" != "true" ]; then extra+=(--no-captions); fi
          if [ "$MUSIC" != "true" ]; then extra+=(--no-music); fi
          python -u -m somoy_jatri.cli stage-story --mode production --run-id "$RUN" --topic "$TOPIC" --period "$PERIOD" --target "$TARGET" --workers "$WORKERS" "${extra[@]}"
      - name: Prepare chapter audio, selective duration recovery and word alignment
        if: inputs.mode == 'production' && !startsWith(inputs.dossier, 'verified:')
        env:
          RESEARCH_DOSSIER: ${{ inputs.dossier }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u -m somoy_jatri.cli prepare --run-id "$RUN" --resume
      - name: Storyboard measured seven-second windows in eight-shot batches
        if: inputs.mode == 'production' && !startsWith(inputs.dossier, 'verified:')
        run: python -u -m somoy_jatri.cli storyboard --run-id "$RUN"
      - name: Refine and verify final preparation checksums
        if: inputs.mode == 'production' && !startsWith(inputs.dossier, 'verified:')
        run: python -u -m somoy_jatri.cli refine-plan --run-id "$RUN"
      - name: Prepare mock preview or explicitly verified legacy storyboard
        if: inputs.mode == 'mock' || startsWith(inputs.dossier, 'verified:')
        env:
          RESEARCH_DOSSIER: ${{ inputs.dossier }}
          STORY_MODEL: Qwen/Qwen3.5-9B
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          WORKERS: ${{ inputs.workers }}
          CAPTIONS: ${{ inputs.captions }}
          MUSIC: ${{ inputs.music }}
        run: |
          extra=()
          if [ "$CAPTIONS" != "true" ]; then extra+=(--no-captions); fi
          if [ "$MUSIC" != "true" ]; then extra+=(--no-music); fi
          python -u -m somoy_jatri.cli prepare --mode "$MODE" --run-id "$RUN" --target "$TARGET" --workers "$WORKERS" "${extra[@]}"
      - name: Save completed preparation and topic history privately
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          if [ -n "$DRIVE_FOLDER_ID" ]; then
            python -m somoy_jatri.cli backup --run-id "$RUN" --snapshot prepared
            python - <<'PYCODE'
          from pathlib import Path
          from somoy_jatri.storage.drive import Store
          from somoy_jatri.utils import load
          if Path('output/topic-history.json').exists():
              Store().save('topic-history.json',load('output/topic-history.json'))
          PYCODE
          fi
      - name: Preserve incomplete preparation for recovery
        if: failure()
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          if [ -n "$DRIVE_FOLDER_ID" ] && [ -d "output/$RUN" ]; then
            python -m somoy_jatri.cli backup --run-id "$RUN" --snapshot preparation-failed
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared
          path: output/episode-${{ github.run_id }}/
          retention-days: 14
  publish-cleanup:
    needs: finish
    if: inputs.mode == 'production' && !inputs.preview_only && needs.finish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[google]'
      - name: Verify private HD upload and delete only tagged temporary Drive media
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          EXPECTED_CHANNEL_ID: ${{ vars.EXPECTED_CHANNEL_ID }}
        run: python -u -m somoy_jatri.storage.verified_cleanup
  images:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[google]'
      - if: inputs.mode == 'production'
        run: pip install -e '.[images]'
      - uses: actions/download-artifact@v4
        with:
          name: prepared
          path: output/episode-${{ github.run_id }}
      - name: Generate assigned seven-second images
        env:
          SHARD: ${{ matrix.shard }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m somoy_jatri.cli images --run-id "$RUN" --shard "$SHARD"
      - name: Preserve shard independently
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          if [ -n "$DRIVE_FOLDER_ID" ]; then
            python -m somoy_jatri.cli backup --run-id "$RUN" --snapshot "shard-$SHARD"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: images-${{ matrix.shard }}
          path: output/episode-${{ github.run_id }}/images/
          retention-days: 14
  finish:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig
      - run: pip install -e '.[google]'
      - uses: actions/download-artifact@v4
        with:
          name: prepared
          path: output/episode-${{ github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          pattern: images-*
          merge-multiple: true
          path: output/episode-${{ github.run_id }}/images
      - name: Install reference MusicRNN CPU model runtime
        run: npm install --ignore-scripts --no-audit --no-fund @magenta/music@1.23.1
      - run: python -m somoy_jatri.cli finish --run-id "$RUN"
      - name: Save verified final output to separate Drive folder
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          if [ -n "$DRIVE_FOLDER_ID" ]; then python -m somoy_jatri.cli backup --run-id "$RUN"; fi
      - name: Upload only when explicitly requested
        if: inputs.mode == 'production' && !inputs.preview_only
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          EXPECTED_CHANNEL_ID: ${{ vars.EXPECTED_CHANNEL_ID }}
          UPLOAD_ENABLED: 'true'
          ALLOW_PUBLIC_UPLOAD: ${{ vars.ALLOW_PUBLIC_UPLOAD }}
          PRIVACY: ${{ inputs.visibility }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python -m somoy_jatri.cli upload --run-id "$RUN" --privacy "$PRIVACY"
      - uses: actions/upload-artifact@v4
        with:
          name: final-episode
          path: |
            output/episode-${{ github.run_id }}/video.mp4
            output/episode-${{ github.run_id }}/thumbnail.jpg
            output/episode-${{ github.run_id }}/captions.srt
            output/episode-${{ github.run_id }}/qc.json
          retention-days: 14

name: Resume voice in parallel and upload privately
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Original run number containing the prepared or partial prepared artifact
        required: true
        type: number
      episode_run:
        description: Original episode run number (0 uses source run)
        type: number
        default: 0
      source_artifact:
        description: Checkpoint artifact to recover
        type: choice
        options: [prepared, voice-checkpoint]
        default: prepared
      voice_workers:
        description: Parallel CPU voice workers (1–16)
        type: number
        default: 8
      image_workers:
        description: Parallel CPU image workers (1–16)
        type: number
        default: 16
permissions:
  contents: read
  actions: read
concurrency:
  group: somoy-jatri-production
  cancel-in-progress: false
env:
  RUN: episode-${{ inputs.episode_run || inputs.source_run }}
  CPU_THREADS: '4'
  HF_HUB_DISABLE_XET: '1'
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[google]'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: output/${{ env.RUN }}
      - name: Validate saved story before more voice generation
        id: matrix
        env:
          VOICE_OPERATION: checkpoint
          VOICE_WORKERS: ${{ inputs.voice_workers }}
          IMAGE_WORKERS: ${{ inputs.image_workers }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -u -m somoy_jatri.narration.worker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-checkpoint
          path: output/${{ env.RUN }}
          retention-days: 14
  voices:
    needs: checkpoint
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.checkpoint.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig
      - run: pip install -e .
      - run: pip install -r requirements-tts.txt
      - uses: actions/download-artifact@v4
        with:
          name: voice-checkpoint
          path: output/${{ env.RUN }}
      - name: Generate or reuse assigned speech takes
        env:
          VOICE_WORKERS: ${{ inputs.voice_workers }}
          SHARD: ${{ matrix.shard }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u -m somoy_jatri.narration.worker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-${{ matrix.shard }}
          path: output/voice-shard-${{ matrix.shard }}/
          retention-days: 14
  prepare:
    needs: voices
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig
      - run: pip install -e '.[google]'
      - run: pip install -r requirements-tts.txt
      - uses: actions/download-artifact@v4
        with:
          name: voice-checkpoint
          path: output/${{ env.RUN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: voice-[0-9]*
          merge-multiple: true
          path: output/${{ env.RUN }}
      - name: Assemble verified narration and timing
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RESEARCH_DOSSIER: auto
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python - <<'PYCODE'
          from somoy_jatri.storage.drive import Store
          from somoy_jatri.utils import save
          save('output/topic-history.json',Store().load('topic-history.json',[]))
          PYCODE
          python -u -m somoy_jatri.cli prepare --run-id "$RUN" --resume
      - name: Validate completed speech and image partition
        id: matrix
        env:
          WORKERS: ${{ inputs.image_workers }}
        run: python -m somoy_jatri.storage.prepared
      - name: Preserve final preparation checkpoint and topic history
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python -m somoy_jatri.cli backup --run-id "$RUN" --snapshot prepared
          python - <<'PYCODE'
          from somoy_jatri.storage.drive import Store
          from somoy_jatri.utils import load
          Store().save('topic-history.json',load('output/topic-history.json'))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared
          path: output/${{ env.RUN }}
          retention-days: 14
  images:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[google]'
      - run: pip install -e '.[images]'
      - uses: actions/download-artifact@v4
        with:
          name: prepared
          path: output/${{ env.RUN }}
      - name: Generate assigned dynamic shots
        env:
          SHARD: ${{ matrix.shard }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m somoy_jatri.cli images --run-id "$RUN" --shard "$SHARD"
      - name: Preserve shard independently
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          if [ -n "$DRIVE_FOLDER_ID" ]; then
            python -m somoy_jatri.cli backup --run-id "$RUN" --snapshot "shard-$SHARD"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: images-${{ matrix.shard }}
          path: output/${{ env.RUN }}/images/
          retention-days: 14
  finish:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig
      - run: pip install -e '.[google]'
      - uses: actions/download-artifact@v4
        with:
          name: prepared
          path: output/${{ env.RUN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: images-*
          merge-multiple: true
          path: output/${{ env.RUN }}/images
      - run: python -m somoy_jatri.cli finish --run-id "$RUN"
      - name: Save verified final output to separate Drive folder
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          if [ -n "$DRIVE_FOLDER_ID" ]; then python -m somoy_jatri.cli backup --run-id "$RUN"; fi
      - name: Upload only when explicitly requested
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          EXPECTED_CHANNEL_ID: ${{ vars.EXPECTED_CHANNEL_ID }}
          UPLOAD_ENABLED: 'true'
          PRIVACY: private
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python -m somoy_jatri.cli upload --run-id "$RUN" --privacy "$PRIVACY"
      - uses: actions/upload-artifact@v4
        with:
          name: final-episode
          path: |
            output/${{ env.RUN }}/video.mp4
            output/${{ env.RUN }}/thumbnail.jpg
            output/${{ env.RUN }}/captions.srt
            output/${{ env.RUN }}/qc.json
          retention-days: 14

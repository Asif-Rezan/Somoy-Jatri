name: Kokoro CPU narration check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/voice-check.yml', 'voice_cpu.py', 'voice_check.py', 'requirements-cpu.txt']
  pull_request:
    branches: [main]
    paths: ['voice_cpu.py', 'voice_check.py', 'requirements-cpu.txt']
  workflow_dispatch:
permissions:
  contents: read
env:
  HF_HUB_DISABLE_XET: '1'
  CPU_TTS_VOICE: am_michael
  CPU_TTS_SPEED: '0.82'
  CPU_TTS_PITCH_SEMITONES: '-2'
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install production narration runtime
        run: |
          python system_dependencies.py ffmpeg espeak-ng
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-cpu.txt
      - name: Generate two narration samples through the production audio path
        run: python -u voice_check.py

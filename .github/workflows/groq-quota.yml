name: Diagnose Groq quota without exposing credentials
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  quota:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python -u scripts/check_groq_quota.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

name: Verify full pipeline before generation
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Failed run containing the prepared storyboard to replay
        type: number
        default: 39146689771
      source_artifact:
        description: Artifact containing the saved storyboard
        type: choice
        options: [prepared, storyboard-replay]
        default: prepared
      text_provider:
        description: Text provider to exercise in the live storyboard test
        type: choice
        options: [auto, gemini]
        default: auto
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig
      - run: pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m somoy_jatri.cli preview --run-id verification-preview
      - uses: actions/upload-artifact@v4
        with:
          name: verified-preview
          path: output/verification-preview/
  storyboard:
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TEXT_BACKEND: qwen-local
      STORY_MODEL: Qwen/Qwen3.5-9B
      STORY_PACE_SECONDS: '0'
      STORY_PROVIDER: ${{ inputs.text_provider }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e .
      - name: Start reference Qwen3.5-9B CPU text model
        if: inputs.text_provider == 'auto'
        run: |
          pip install 'huggingface-hub>=0.34,<1'
          bash scripts/setup_qwen.sh
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: output/storyboard-replay
      - name: Replay every saved segment against live model and source validation
        run: python -u scripts/verify_storyboard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storyboard-replay
          path: output/storyboard-replay/
  components:
    needs: offline
    strategy:
      fail-fast: false
      matrix:
        component: [tts-test, image-test, music-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CPU_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig
      - run: pip install -e .
      - if: matrix.component == 'tts-test'
        run: pip install -r requirements-voice.txt
      - if: matrix.component == 'image-test'
        run: pip install -e '.[images]'
      - if: matrix.component == 'music-test'
        run: npm install --ignore-scripts --no-audit --no-fund @magenta/music@1.23.1
      - run: python -u -m somoy_jatri.cli "$COMPONENT" --mode production --run-id component-verification
      - name: Verify generated image integrity
        if: matrix.component == 'image-test'
        run: python -c "from pathlib import Path; from somoy_jatri.images.providers import verify; verify(Path('output/component-verification/image-test.png'))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-${{ matrix.component }}
          path: output/component-verification/

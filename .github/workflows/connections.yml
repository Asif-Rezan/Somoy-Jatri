name: Verify Google connections
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: somoy-jatri-connection-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[google]'
      - name: Verify account routing and private checkpoint access
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          EXPECTED_CHANNEL_ID: ${{ vars.EXPECTED_CHANNEL_ID }}
          EXPECTED_DRIVE_EMAIL: ${{ vars.EXPECTED_DRIVE_EMAIL }}
        run: python -u scripts/check_connections.py

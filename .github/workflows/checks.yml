name: Offline tests and short preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig
      - run: pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m somoy_jatri.cli preview --run-id preview
      - uses: actions/upload-artifact@v4
        with:
          name: offline-preview
          path: |
            output/preview/video.mp4
            output/preview/thumbnail.jpg
            output/preview/captions.srt
            output/preview/qc.json
          retention-days: 7

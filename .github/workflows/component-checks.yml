name: Cloud component checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: |
          python system_dependencies.py ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
          CONTENT_TYPE=islamic-documentary python -m unittest -v
      - run: node --test test_music_retry.cjs

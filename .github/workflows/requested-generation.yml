name: Test and start requested new video
on:
  push:
    branches: [main]
    paths: ['.github/generation-request.json']
permissions:
  contents: read
  actions: write
jobs:
  test-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig
      - run: pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m somoy_jatri.cli preview --run-id requested-preview
      - uses: actions/upload-artifact@v4
        with:
          name: requested-generation-test-preview
          path: output/requested-preview/
          retention-days: 7
      - name: Start new production video after successful tests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          config=json.loads(Path('.github/generation-request.json').read_text())
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          base='https://api.github.com/repos/'+os.environ['REPO']
          with urllib.request.urlopen(urllib.request.Request(base+'/git/ref/heads/main',headers=headers),timeout=30) as response:
              if json.load(response)['object']['sha']!=os.environ['EXPECTED_SHA']:
                  raise ValueError('Main changed after tests; submit a new generation request')
          body={'ref':'main','inputs':config['inputs']}
          request=urllib.request.Request(base+'/actions/workflows/generate.yml/dispatches',
              data=json.dumps(body).encode(),headers=headers,method='POST')
          with urllib.request.urlopen(request,timeout=30) as response:
              if response.status!=204: raise ValueError('Generation dispatch failed')
          print('New video requested: Bangla voice, seven-second images, historical documentary music; no YouTube upload.')
          PY

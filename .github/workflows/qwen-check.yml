name: Verify local Qwen Bangla generation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  text:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . 'huggingface-hub>=0.34,<1'
      - run: bash scripts/setup_qwen.sh
      - name: Verify real structured Bangla output without cloud credentials
        run: |
          python - <<'PY'
          import re
          from somoy_jatri.scripts.groq import Groq
          schema={'type':'object','properties':{'text':{'type':'string'}},
                  'required':['text'],'additionalProperties':False}
          result=Groq().json('Write one short natural Bangla greeting as text.',schema=schema)
          if not re.search(r'[\u0980-\u09ff]',result['text']):
              raise ValueError('Expected Bengali script')
          print('Local Qwen structured Bengali generation passed')
          PY

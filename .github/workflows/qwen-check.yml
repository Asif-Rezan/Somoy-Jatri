name: Verify local Qwen Bangla generation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  text:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . -r requirements-story.txt
      - name: Verify reference Qwen3-4B structured Bengali generation
        run: python -u scripts/check_story_cpu.py
      - name: Verify full reference outline and four Bengali chapter batches
        run: python -u scripts/check_reference_story.py

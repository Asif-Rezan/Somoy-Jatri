name: Recover, verify upload or clean a saved episode
on:
  workflow_dispatch:
    inputs:
      run:
        description: Original episode run ID
        required: true
        type: string
      operation:
        type: choice
        options: [restore, prepare, images, finish, upload, cleanup]
        default: restore
      snapshot:
        type: string
        default: checkpoint
      shard:
        type: number
        default: 0
permissions:
  contents: read
concurrency:
  group: somoy-jatri-production
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RUN: ${{ inputs.run }}
      OPERATION: ${{ inputs.operation }}
      SNAPSHOT: ${{ inputs.snapshot }}
      SHARD: ${{ inputs.shard }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ vars.EXPECTED_CHANNEL_ID }}
      UPLOAD_ENABLED: 'true'
      RUN_SCOPED_CLEANUP: 'true'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig
      - run: pip install -e '.[google]'
      - run: python -m somoy_jatri.cli restore --run-id "$RUN" --snapshot "$SNAPSHOT"
      - if: inputs.operation == 'images'
        run: pip install -e '.[images]'
      - name: Install reference MusicRNN CPU runtime
        if: inputs.operation == 'finish'
        run: npm install --ignore-scripts --no-audit --no-fund @magenta/music@1.23.1
      - name: Install chapter preparation dependencies
        if: inputs.operation == 'prepare'
        run: |
          pip install -r requirements-story.txt -r requirements-voice.txt
          python -c "import edge_tts; from somoy_jatri.narration.providers import ONLINE_VOICE; assert ONLINE_VOICE == 'bn-BD-PradeepNeural'"
      - if: inputs.operation == 'prepare'
        env:
          RESEARCH_DOSSIER: auto
        run: |
          python -u -m somoy_jatri.cli prepare --run-id "$RUN" --resume
          python -u -m somoy_jatri.cli storyboard --run-id "$RUN"
          python -u -m somoy_jatri.cli refine-plan --run-id "$RUN"
      - if: inputs.operation != 'restore' && inputs.operation != 'prepare'
        run: python -m somoy_jatri.cli "$OPERATION" --run-id "$RUN" --shard "$SHARD"
      - if: inputs.operation != 'cleanup'
        run: python -m somoy_jatri.cli backup --run-id "$RUN" --snapshot "$SNAPSHOT"

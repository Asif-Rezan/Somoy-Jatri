name: Resume prepared episode and upload privately
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Run number containing the verified prepared artifact
        required: true
        type: number
      workers:
        description: Parallel CPU image jobs (1–16)
        type: number
        default: 16
permissions:
  contents: read
  actions: read
concurrency:
  group: somoy-jatri-production
  cancel-in-progress: false
env:
  RUN: episode-${{ inputs.source_run }}
  CPU_THREADS: '4'
  HF_HUB_DISABLE_XET: '1'
  RUN_SCOPED_CLEANUP: 'true'
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig
      - run: pip install -e '.[google]'
      - name: Verify private upload connections
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          EXPECTED_CHANNEL_ID: ${{ vars.EXPECTED_CHANNEL_ID }}
          EXPECTED_DRIVE_EMAIL: ${{ vars.EXPECTED_DRIVE_EMAIL }}
        run: python -u scripts/check_connections.py
      - uses: actions/download-artifact@v4
        with:
          name: prepared
          run-id: ${{ inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: output/${{ env.RUN }}
      - name: Validate completed speech and repartition images
        id: matrix
        env:
          WORKERS: ${{ inputs.workers }}
        run: python -m somoy_jatri.storage.prepared
      - name: Preserve updated image partition configuration
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python -m somoy_jatri.cli backup --run-id "$RUN" --snapshot prepared
      - uses: actions/upload-artifact@v4
        with:
          name: prepared
          path: output/${{ env.RUN }}
          retention-days: 14
  images:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[google]'
      - run: pip install -e '.[images]'
      - uses: actions/download-artifact@v4
        with:
          name: prepared
          path: output/${{ env.RUN }}
      - name: Generate assigned dynamic shots
        env:
          SHARD: ${{ matrix.shard }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m somoy_jatri.cli images --run-id "$RUN" --shard "$SHARD"
      - name: Preserve shard independently
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          if [ -n "$DRIVE_FOLDER_ID" ]; then
            python -m somoy_jatri.cli backup --run-id "$RUN" --snapshot "shard-$SHARD"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: images-${{ matrix.shard }}
          path: output/${{ env.RUN }}/images/
          retention-days: 14
  finish:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig
      - run: pip install -e '.[google]'
      - uses: actions/download-artifact@v4
        with:
          name: prepared
          path: output/${{ env.RUN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: images-*
          merge-multiple: true
          path: output/${{ env.RUN }}/images
      - run: python -m somoy_jatri.cli finish --run-id "$RUN"
      - name: Save verified final output to separate Drive folder
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          if [ -n "$DRIVE_FOLDER_ID" ]; then python -m somoy_jatri.cli backup --run-id "$RUN"; fi
      - name: Upload only when explicitly requested
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          EXPECTED_CHANNEL_ID: ${{ vars.EXPECTED_CHANNEL_ID }}
          UPLOAD_ENABLED: 'true'
          PRIVACY: private
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python -m somoy_jatri.cli upload --run-id "$RUN" --privacy "$PRIVACY"
      - uses: actions/upload-artifact@v4
        with:
          name: final-episode
          path: |
            output/${{ env.RUN }}/video.mp4
            output/${{ env.RUN }}/thumbnail.jpg
            output/${{ env.RUN }}/captions.srt
            output/${{ env.RUN }}/qc.json
          retention-days: 14

name: Model component test
on:
  workflow_dispatch:
    inputs:
      component:
        type: choice
        options: [tts-test, image-test, music-test, hf-voice-audition]
        default: tts-test
      mode:
        type: choice
        options: [mock, production]
        default: mock
permissions:
  contents: read
jobs:
  component:
    runs-on: ${{ inputs.component == 'hf-voice-audition' && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      CPU_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COMPONENT: ${{ inputs.component }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig
      - run: pip install -e .
      - if: inputs.mode == 'production' && inputs.component == 'tts-test'
        run: pip install -r requirements-voice.txt
      - if: inputs.mode == 'production' && inputs.component == 'image-test'
        run: pip install -e '.[images]'
      - if: inputs.mode == 'production' && inputs.component == 'music-test'
        run: npm install --ignore-scripts --no-audit --no-fund @magenta/music@1.23.1
      - name: Install Hugging Face voice audition runtime
        if: inputs.component == 'hf-voice-audition'
        run: |
          pip install torch==2.7.1+cpu torchaudio==2.7.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install coqui-tts==0.28.0 'transformers>=4.57,<5' huggingface-hub soundfile
      - name: Audition fixed female Bangla model without changing production
        if: inputs.component == 'hf-voice-audition'
        env:
          TORCH_FORCE_WEIGHTS_ONLY_LOAD: '1'
        run: python -u scripts/audition_hf_bangla.py
      - if: inputs.component != 'hf-voice-audition'
        run: python -m somoy_jatri.cli "$COMPONENT" --mode "$MODE" --run-id component
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-component-test
          path: |
            output/component/*
            output/hf-voice-audition/*
          retention-days: 7
